<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 220" font-family="'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1220"/>
      <stop offset="1" stop-color="#181b2e"/>
    </linearGradient>
    <style>
      @keyframes dash { to { stroke-dashoffset:-40 } }
      @keyframes glow { 0%,100% { opacity:.9 } 50% { opacity:.4 } }
      @keyframes rise { 0% { height:10 } 100% { height:90 } }
    </style>
  </defs>
  <rect width="1200" height="220" fill="url(#bg)" rx="16"/>
  <text x="55" y="75" fill="#f8fafc" font-size="42" font-weight="700">Matilda — LLMs from scratch</text>
  <text x="55" y="110" fill="#a5b4fc" font-size="20">114M → 152M → trained on 7.5B tokens · beats Pythia-160M · 29.6% MFU</text>
  <g stroke="#a5b4fc" stroke-width="3" fill="none">
    <path d="M55 150 H1145" stroke-dasharray="12 12" style="animation:dash 1.5s linear infinite"/>
  </g>
  <g>
    <rect x="90" y="130" width="10" height="60" fill="#818cf8" style="animation:rise 1.3s infinite alternate"/>
    <rect x="115" y="110" width="10" height="80" fill="#a5b4fc" style="animation:rise 1.1s infinite alternate"/>
    <rect x="140" y="90" width="10" height="100" fill="#c4b5fd" style="animation:rise .9s infinite alternate"/>
  </g>
  <text x="180" y="140" fill="#f1f5f9" font-size="24" font-weight="700">PIQA 0.649 · ARC-easy 0.554</text>
  <text x="180" y="168" fill="#94a3b8" font-size="15">41 wins / 3 ties / 2 losses across 10 checkpoints × 5 tasks (lm-eval-harness, 0-shot)</text>
  <circle cx="1090" cy="70" r="9" fill="#34d399" style="animation:glow 1.4s infinite"/>
  <text x="1070" y="100" fill="#94a3b8" font-size="14">bit-for-bit resume &lt;1e-6</text>
</svg>
